[pytest]
# PV-MEPCG / PulseVision — test configuration (Phase 06, task T06.1)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers: an unregistered marker is an ERROR, not a silent no-op.
#   Without it, a typo like @pytest.mark.needs_dataa attaches a marker nothing
#   ever selects on, so the test runs in CI where the dataset does not exist and
#   fails there instead of skipping. Strict mode turns that typo into an
#   immediate collection error.
# --strict-config: an unknown ini key is an error rather than being ignored.
addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --durations=10

markers =
    slow: takes more than a few seconds. Skipped by default; pass --runslow to include.
    needs_data: reads the real dataset/ tree. Auto-skipped when dataset/ is absent -- the 1.3 GB corpus is gitignored and never reaches CI, so these are excluded there by design, not by accident. CI additionally deselects them with -m "not needs_data".

# Keep the log file this suite produces out of outputs/logs/ noise concerns:
# tests that configure logging use the tmp_output_dir fixture instead.
log_cli = false

filterwarnings =
    default
