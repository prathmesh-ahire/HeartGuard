# PV-MEPCG / PulseVision — model defaults and search spaces (T03.4)
#
# `defaults` are the untuned baseline parameters used by EXP-A1 (Phase 64).
# `search_space` is consumed by the model registry (T51.1) and the search
# framework (Part VI). Searches run on INNER folds only; the outer test fold is
# never scored during search (T54.3, T54.6).
#
# Every estimator carries random_state 42. Rule 5: two runs of the same command
# must produce identical numbers.
#
# NOTE ON SCIENTIFIC NOTATION: PyYAML implements YAML 1.1, whose float pattern
# requires a SIGNED exponent. `1.0e-3` parses as a float; `1.0e3` parses as the
# STRING "1.0e3" and blows up the first time anything compares it to a number.
# Always write `1.0e+3`. Guarded by tests/test_model_spaces.py.

global:
  random_state: 42
  n_jobs: -1
  # CPU only — this machine has no CUDA device. Any GPU parameter is wrong here.
  device: "cpu"

# --- fold-safe pipeline (Phase 44) ------------------------------------------
# Imputer, scaler and selector are pipeline STEPS so they fit on the training
# fold only. Rule 2. Fitting any of them on the full matrix is leakage.
pipeline:
  imputer:
    strategy: "median"
  scaler:
    kind: "standard"        # StandardScaler
    with_mean: true
    with_std: true
  selector:
    enabled: false          # switched on by SO-04 / the A8 ablation
    kind: "none"            # "mutual_info" | "anova_f" | "rfecv" | "fixed_subset"
    k: 60
  class_weight:
    strategy: "balanced"    # applied where the estimator supports it
  resampling:
    enabled: false          # imbalance is handled by class weights by default

# --- calibration (Phase 47) -------------------------------------------------
# SVM has no native probabilities and the soft-voting ensemble needs well-formed
# ones, so M3 is wrapped explicitly. The calibrator is fitted INSIDE the training
# fold, never on the outer test fold.
calibration:
  method: "sigmoid"         # "isotonic" needs more data than PASCAL A provides
  cv: 3
  fit_inside_fold: true
  # ensemble=true averages the k per-calibration-fold models; false calibrates a
  # single model refitted on all training rows. Measured on D1 fold 0 in
  # `svm_calibration_benchmark.csv` — see the Phase 47 entry in Docs/note.md.
  ensemble: true

models:

  # --- M1 Logistic Regression (Phase 46) ------------------------------------
  M1:
    name: "Logistic Regression"
    estimator: "sklearn.linear_model.LogisticRegression"
    mandatory: true
    defaults:
      C: 1.0
      # `penalty` was DEPRECATED in scikit-learn 1.8 and is removed in 1.10.
      # `l1_ratio` is its replacement and produces bit-identical fits:
      # 0.0 == penalty "l2", 1.0 == penalty "l1", between == elasticnet.
      # Verified on 2026-08-27; see the Phase 46 entry in Docs/note.md.
      l1_ratio: 0.0
      solver: "lbfgs"
      max_iter: 2000        # raised from the sklearn default of 100; 138 scaled
                            # features do not converge reliably at 100
      class_weight: "balanced"
      random_state: 42
    search_space:
      C: {type: "log_uniform", low: 1.0e-3, high: 1.0e+3}
      l1_ratio: {type: "categorical", choices: [0.0, 0.5, 1.0]}
      solver: {type: "categorical", choices: ["lbfgs", "liblinear", "saga"]}
      max_iter: {type: "categorical", choices: [1000, 2000, 5000]}
    # Not every (solver, l1_ratio) pair is legal; the illegal ones raise rather
    # than degrade, so the space is filtered by `spaces.M1_SOLVER_PENALTY`
    # before sampling. lbfgs: 0.0 only. liblinear: 0.0 or 1.0. saga: anything.
    constraints: ["M1_SOLVER_PENALTY"]

  # --- M2 K-Nearest Neighbours (Phase 46, optional baseline) ----------------
  M2:
    name: "K-Nearest Neighbours"
    estimator: "sklearn.neighbors.KNeighborsClassifier"
    mandatory: false
    defaults:
      n_neighbors: 5
      weights: "uniform"
      metric: "minkowski"
      p: 2
    search_space:
      n_neighbors: {type: "int_uniform", low: 3, high: 31}
      weights: {type: "categorical", choices: ["uniform", "distance"]}
      metric: {type: "categorical", choices: ["minkowski", "manhattan", "chebyshev"]}
      p: {type: "categorical", choices: [1, 2]}
    # `p` is read only when metric is "minkowski"; sklearn silently ignores it
    # otherwise, so an unconstrained space spends half its budget re-evaluating
    # configurations it has already seen. Pinned to p=2 off minkowski.
    constraints: ["M2_P_ONLY_FOR_MINKOWSKI"]

  # --- M3 SVM-RBF (Phase 47) — an ensemble member ---------------------------
  M3:
    name: "SVM (RBF kernel)"
    estimator: "sklearn.svm.SVC"
    mandatory: true
    calibrate: true         # probability=False + explicit CalibratedClassifierCV
    defaults:
      C: 1.0
      gamma: "scale"
      kernel: "rbf"
      probability: false
      class_weight: "balanced"
      cache_size: 500       # MB
      random_state: 42
    search_space:
      C: {type: "log_uniform", low: 1.0e-2, high: 1.0e+3}
      gamma: {type: "log_uniform", low: 1.0e-4, high: 1.0e+1}
      class_weight: {type: "categorical", choices: ["balanced", null]}

  # --- M4 Random Forest (Phase 48) — an ensemble member ---------------------
  M4:
    name: "Random Forest"
    estimator: "sklearn.ensemble.RandomForestClassifier"
    mandatory: true
    defaults:
      n_estimators: 500
      max_depth: null
      min_samples_leaf: 1
      max_features: "sqrt"
      class_weight: "balanced"
      n_jobs: -1
      random_state: 42
    search_space:
      n_estimators: {type: "int_uniform", low: 100, high: 1000}
      max_depth: {type: "categorical", choices: [null, 5, 10, 20, 30]}
      min_samples_leaf: {type: "int_uniform", low: 1, high: 10}
      max_features: {type: "categorical", choices: ["sqrt", "log2", 0.3, 0.5]}
      class_weight: {type: "categorical", choices: ["balanced", "balanced_subsample", null]}

  # --- M5 Gradient Boosting (Phase 49) — an ensemble member -----------------
  M5:
    name: "Gradient Boosting"
    estimator: "sklearn.ensemble.GradientBoostingClassifier"
    hist_estimator: "sklearn.ensemble.HistGradientBoostingClassifier"
    mandatory: true
    # "classic" is the estimator both source documents name. "hist" is the
    # binned implementation, ~6x faster on this matrix. T49.1 permits either;
    # the measured cost of the choice is in gradient_boosting_choice.csv.
    implementation: "classic"
    # GradientBoostingClassifier has NO class_weight, so it is wrapped in
    # ClassWeightedClassifier, which converts this into per-row sample_weight
    # using scikit-learn's own "balanced" definition. Without it M5 would be the
    # only mandatory ensemble member with no imbalance handling at all.
    defaults:
      n_estimators: 200
      learning_rate: 0.1
      max_depth: 3
      subsample: 1.0
      min_samples_leaf: 1
      class_weight: "balanced"
      random_state: 42
    search_space:
      n_estimators: {type: "int_uniform", low: 100, high: 800}
      learning_rate: {type: "log_uniform", low: 1.0e-3, high: 0.5}
      max_depth: {type: "int_uniform", low: 2, high: 8}
      subsample: {type: "uniform", low: 0.6, high: 1.0}
      min_samples_leaf: {type: "int_uniform", low: 1, high: 20}

  # --- M6 equal-weight soft voting (Phase 50) — the mandatory baseline ------
  M6:
    name: "Soft Voting (equal weights)"
    estimator: "src.ensemble.soft_voting.SoftVotingEnsemble"
    mandatory: true
    members: ["M3", "M4", "M5"]   # calibrated SVM-RBF, RF, GB
    # Members are NOT treated alike, on evidence. M3 carries its own explicit
    # calibration (an SVM has no probabilities at all). Calibrating M4 makes its
    # ECE *worse* — 0.027 -> 0.039 measured on D1 fold 0 — so it stays raw.
    # Calibrating M5 improves it substantially, 0.088 -> 0.029. One uniform
    # policy would knowingly degrade a member for the sake of symmetry.
    # Evidence: outputs/04_models/tree_calibration_assessment.csv (T48.5/T49.5).
    calibrate_members: ["M5"]
    defaults:
      weights: "equal"
      voting: "soft"
      inner_cv: 3
      # T50.4: the binary decision rule is a threshold chosen inside the
      # training fold, not a fixed 0.5. Applies to M6 as well as M7 — the
      # baseline and the proposed model must differ in their weights, not in
      # their decision rule, or the comparison measures the wrong thing.
      tune_threshold: true
      # DECIDED 2026-08-27 against measurements on D1 fold 0, not by default.
      # `balanced_accuracy_plus_sensitivity` is algebraically 1.5*sens +
      # 0.5*spec, so it weights sensitivity 3x specificity; it drove the
      # threshold to 0.153 and produced test sensitivity 1.000 at specificity
      # 0.619 — a number that reads as a bug and costs balanced accuracy.
      # `balanced_accuracy` beats a fixed 0.5 on BOTH metrics rule 6 selects on
      # (sens 0.871 vs 0.689, bal 0.836 vs 0.786) and does not saturate.
      # `youden` is a monotone transform of it and picks the same threshold.
      # Evidence: outputs/04_models/threshold_objective_comparison.csv.
      objective: "balanced_accuracy"
    search_space: {}              # nothing to search — this is the fixed baseline

  # --- M7 optimized-weight soft voting (Phase 50) — the PROPOSED model ------
  M7:
    name: "Soft Voting (optimized weights)"
    estimator: "src.ensemble.soft_voting.SoftVotingEnsemble"
    mandatory: true
    members: ["M3", "M4", "M5"]
    calibrate_members: ["M5"]
    defaults:
      weights: "optimized"
      voting: "soft"
      inner_cv: 3
      tune_threshold: true
      objective: "balanced_accuracy"   # see the note on M6; decided 2026-08-27
    weight_search:
      # Weights are optimized on OUT-OF-FOLD probabilities from the inner folds
      # only (T50.5). Touching the outer test fold here would invalidate every
      # headline result in the project.
      method: "SO-05"
      simplex_constrained: true   # weights are non-negative and sum to 1
      objective: "balanced_accuracy"
      # An exhaustive grid over the simplex, not an optimiser. Balanced accuracy
      # is a step function of the weights, so it has zero gradient almost
      # everywhere and SLSQP/L-BFGS stall at their starting point. 0.05 over
      # three members is 231 points, evaluated in vectorised numpy, and is
      # identical on every machine — rule 5 for free.
      resolution: 0.05
      # Weights and threshold are chosen JOINTLY: each weight vector is scored
      # at its own best threshold. The best weights at 0.5 are not the best
      # weights at the threshold the model will actually use.
      joint_with_threshold: true
      # ONE-STANDARD-ERROR RULE (added 2026-08-27, on the user's instruction and
      # on principle, NOT to move a score). Taking the argmax of 231 candidates
      # scored on a few thousand rows captures some signal and some luck, and the
      # more candidates there are the more of the winning margin is luck. So the
      # search takes the SIMPLEST candidate — the one closest to equal weights,
      # which is M6 — whose score is within `n_standard_errors` of the best.
      # M7 therefore departs from its own baseline only where the evidence
      # exceeds the noise.
      # The margin is exact, not bootstrapped: every objective is a*sens +
      # b*spec, and both are binomial proportions over disjoint record sets, so
      # SE = sqrt(a^2*sens(1-sens)/n_pos + b^2*spec(1-spec)/n_neg).
      # This is a SELECTION RULE, not a tuning knob. It would be the right rule
      # whether M7 were winning or losing, and it must never be adjusted in
      # response to a result. See the 2026-08-27 Phases 50-52 entry in note.md.
      selection_rule: "one_standard_error"
      n_standard_errors: 1.0
    search_space: {}

  # --- M8 external gradient boosting (Phase 49) -----------------------------
  # Behind a capability check that degrades gracefully if the package is absent
  # (T49.3). Both are installed and verified on this machine (Phase 02).
  M8:
    name: "XGBoost / LightGBM"
    estimator: "xgboost.XGBClassifier"
    fallback_estimator: "lightgbm.LGBMClassifier"
    mandatory: false
    capability_check: true
    defaults:
      n_estimators: 400
      learning_rate: 0.1
      max_depth: 6
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      tree_method: "hist"
      # PINNED, and NOT the global -1. XGBoost draws its `subsample` row mask per
      # thread block, so with subsample < 1.0 the number of threads changes which
      # rows each tree sees: measured 2026-08-27, n_jobs=1 against n_jobs=4
      # differ by up to 0.062 in predicted probability -- a different model, not
      # a rounding artifact. `-1` means "however many cores this machine has",
      # which would make M8 irreproducible across machines and CI runners and
      # break research rule 5. A fixed thread count is deterministic on any
      # machine, including one with fewer cores. Do not change this to -1.
      n_jobs: 4
      random_state: 42
      # XGBoost has no class_weight and only binary scale_pos_weight, so M8 is
      # wrapped in ClassWeightedClassifier for one mechanism that works on the
      # multiclass tracks too. LightGBM has a native class_weight and is not
      # wrapped.
      class_weight: "balanced"
      # DETERMINISM IS NOT A FLAG HERE. `deterministic` is not an XGBoost
      # parameter -- the booster accepts it silently and logs
      # `Parameters: { "deterministic" } are not used`. It was measured instead:
      # XGBoost, LightGBM and RandomForest all produce bit-identical
      # probabilities between n_jobs=1 and n_jobs=-1 on the real D1 matrix
      # (2026-08-27). Kept declared so the intent is on record; make_m8 reads it
      # as a note and drops it. See the Phase 48-49 entry in Docs/note.md.
      deterministic: true
    search_space:
      n_estimators: {type: "int_uniform", low: 100, high: 1000}
      learning_rate: {type: "log_uniform", low: 1.0e-3, high: 0.5}
      max_depth: {type: "int_uniform", low: 2, high: 10}
      subsample: {type: "uniform", low: 0.6, high: 1.0}
      colsample_bytree: {type: "uniform", low: 0.5, high: 1.0}
      reg_lambda: {type: "log_uniform", low: 1.0e-2, high: 1.0e+2}

  # --- M9 1D-CNN (Phase 52) — OPTIONAL, EXCLUDED -----------------------------
  # DECIDED OUT OF SCOPE by the user on 2026-08-27 (T52.1), against the measured
  # cost of the classical stack: all eight classical models fit one fold in
  # 41.1 s, so the full 5x5 map is ~17 min. A 1D-CNN over raw segments is hours
  # per fold on 4 CPU cores with no GPU, and T52.4 requires it to use the SAME
  # fold map or its accuracy cannot be placed beside the others'. Listed as
  # Optional in both source documents.
  # The exclusion and its technical reason are recorded in
  # outputs/missing_outputs_report.txt (T52.6). Kept declared here, rather than
  # deleted, so the registry reports it as an explicit exclusion instead of an
  # oversight. NO claim may compare PV-MEPCG against a CNN.
  M9:
    name: "1D-CNN"
    estimator: null
    mandatory: false
    in_scope: false           # decided 2026-08-27; see missing_outputs_report.txt
    exclusion_reason: >-
      CPU-only hardware (4 logical cores, no CUDA). Days of wall clock for the
      5x5 fold map against ~17 min for the whole classical stack, and a reduced
      fold map would break the comparison T52.4 requires.
    defaults: {}
    search_space: {}
