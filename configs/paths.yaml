# PV-MEPCG / PulseVision — filesystem layout (T03.1)
#
# Every path in this project resolves through this file. Nothing hardcodes a
# dataset location in Python.
#
# ABSOLUTE vs PORTABLE
#   `project_root` is "auto": src/utils/config.py resolves it to the directory
#   that contains this configs/ folder. Every other path is declared relative to
#   it and resolved to an absolute path at load time, so downstream code always
#   receives an absolute path (as T03.1 requires) and the repository works from
#   any location on any machine without an edit.
#
#   It used to hold a literal "D:/Projects/HeartGuard". That is a
#   machine-specific value in a committed file, and on CI it produced paths like
#   /home/runner/work/HeartGuard/HeartGuard/D:/Projects/HeartGuard/outputs/...
#   -- a Windows path glued onto a Linux checkout. Every derived path was wrong
#   on every machine except one. See Docs/note.md, 2026-08-26 Phase 30.
#
#   An explicit absolute path still works (for an out-of-tree checkout), and an
#   environment override still wins over both:
#     PowerShell:  $env:HEARTGUARD__PATHS__PROJECT_ROOT = "E:\HeartGuard"
#     bash:        export HEARTGUARD__PATHS__PROJECT_ROOT=/mnt/e/HeartGuard
#
# THE DOUBLED CIRCOR DIRECTORY BELOW IS NOT A TYPO. The real tree is
# archive/training_data/training_data/. A path built as archive/training_data/
# matches zero files and returns an empty list rather than raising — the worst
# possible failure mode. See Docs/note.md, 2026-08-22 audit, finding 2.

project_root: "auto"          # resolved to the repository root; see above

# --- dataset roots (read-only input; never written to, never committed) ------
dataset:
  root: "dataset"

  # D1 — PhysioNet/CinC 2016. 3,240 train (a-f) + 301 validation @ 2000 Hz.
  d1_physionet:
    root: "dataset/archive (3)"
    subsets: ["training-a", "training-b", "training-c", "training-d", "training-e", "training-f"]
    validation: "dataset/archive (3)/validation"
    annotations: "dataset/archive (3)/annotations"
    appendix_training: "dataset/archive (3)/annotations/Online_Appendix_training_set.csv"
    appendix_diagnosis: "dataset/archive (3)/annotations/Online_Appendix_Diagnosis_meanings.csv"
    # REFERENCE.csv and REFERENCE-SQI.csv live inside each subset directory.
    reference_filename: "REFERENCE.csv"
    reference_sqi_filename: "REFERENCE-SQI.csv"

  # D2 — PASCAL set_a. 124 labeled + 52 unlabelled @ 44100 Hz.
  d2_pascal_a:
    root: "dataset/archive (2)/set_a"
    csv: "dataset/archive (2)/set_a.csv"
    timing_csv: "dataset/archive (2)/set_a_timing.csv"

  # D3 — PASCAL set_b. 461 labeled + 195 unlabelled @ 4000 Hz.
  # WARNING: set_b.csv filenames have ZERO overlap with the files on disk
  # (Btraining_extrastole_127_... vs extrastole__127_...). The CSV is a
  # cross-check only; labels come from the Heartbeat_Sound folder structure.
  d3_pascal_b:
    root: "dataset/archive (2)/set_b"
    csv: "dataset/archive (2)/set_b.csv"

  # D4 — CirCor DigiScope 2022. 942 patients / 3,163 recordings @ 4000 Hz.
  d4_circor:
    root: "dataset/archive/training_data/training_data"   # doubled — see header
    # AND the metadata files are NOT inside that doubled directory. They sit one
    # level above it, directly in archive/, alongside the outer training_data/
    # folder. Verified on disk 2026-08-23; see Docs/note.md.
    demographics_csv: "dataset/archive/training_data.csv"
    records_index: "dataset/archive/RECORDS"
    checksums: "dataset/archive/SHA256SUMS.txt"
    license: "dataset/archive/LICENSE.txt"

  # Authoritative PASCAL label source: same audio as set_a + set_b, re-foldered
  # by class. 100% duplicate (832/832 filename overlap).
  # LABEL HELPER ONLY — including it in any supervised track silently doubles
  # the PASCAL data and puts the same recording in both train and test.
  heartbeat_sound:
    root: "dataset/Heartbeat_Sound"
    classes: ["artifact", "extrahls", "extrastole", "murmur", "normal", "unlabel"]
    is_training_source: false

# --- derived data (regenerable; gitignored) ---------------------------------
