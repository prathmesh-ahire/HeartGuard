# PV-MEPCG / PulseVision — signal preprocessing (T03.2)
#
# Consumed by src/preprocessing/ (Phases 23-29). Every value here is hashed into
# the preprocessed-signal cache key (T27.3), so changing any of it invalidates
# the cache rather than silently mixing settings.

# --- resampling (Phase 23) --------------------------------------------------
resample:
  target_fs: 2000              # Hz. All four datasets are brought to this rate.
  method: "soxr_hq"            # high-quality anti-aliased polyphase resampler
  # PASCAL A is 44100 Hz -> 2000 Hz, a factor of 22.05. Naive decimation
  # (x[::22]) aliases badly at this ratio; T23.4 verifies with a swept sine.
  native_fs:
    d1_physionet: 2000         # no-op path
    d2_pascal_a: 44100         # 22.05x decimation
    d3_pascal_b: 4000          # 2x decimation
    d4_circor: 4000            # 2x decimation
  mono: "mean"                 # channel mean; no-op fast path (all files mono)
  dtype: "float32"

# --- bandpass filter (Phase 24) ---------------------------------------------
filter:
  enabled: true                # ablation PP-09 flips this
  type: "butterworth"
  order: 4                     # prototype order. The bandpass transform doubles it
                               # to 8 poles (4 SOS sections), and sosfiltfilt runs
                               # it forwards and backwards, doubling again to an
                               # effective 16: -6.02 dB at each cutoff rather than
                               # -3.01, zero phase. Documented in T24.2.
  low_hz: 20
  high_hz: 400                 # well below the 1000 Hz Nyquist at target_fs
  design: "sos"                # second-order sections; numerically stable at order 4
  zero_phase: true             # scipy.signal.sosfiltfilt
  # sosfiltfilt needs padlen = 27 samples of edge padding for this design (4
  # second-order sections). Every record in the corpus clears it: the shortest,
  # 0.76 s, is 1,520 samples at 2 kHz. An earlier draft of this comment claimed
  # the opposite; Phase 24 measured it. The guard below reduces padding and flags
  # the record rather than raising, and exists for the inference API, where an
  # uploaded clip can be any length.
  short_signal_policy: "reduce_padlen"
  min_padlen: 12

# --- normalization (Phase 25) -----------------------------------------------
normalization:
  enabled: true                # ablation PP-09 flips this
  method: "zscore"             # alternatives: "peak", "none"
  remove_dc: true              # subtract the mean before normalizing
  # Guard against a constant / all-silent record producing division by zero.
  zero_variance_epsilon: 1.0e-10
  zero_variance_policy: "passthrough_and_flag"

# --- signal quality analysis (Phase 26) -------------------------------------
quality:
  clipping_threshold: 0.99     # |sample| above this counts as clipped
  clipping_ratio_flag: 0.01    # >1% clipped samples -> flagged
  silence_threshold_db: -60.0  # frame RMS below this counts as silence
  silence_ratio_flag: 0.50
  snr_proxy:
    in_band: [20, 400]         # must match filter.low_hz / filter.high_hz
    out_of_band: [400, 1000]   # up to Nyquist at target_fs
    low_snr_db_flag: 5.0
  spectral_flatness_flag: 0.50 # above this the record is noise-like
  # Power below in_band[0] relative to the in-band power, in dB. Positive means
  # the recording holds more energy below 20 Hz -- rubbing, movement, breathing,
  # loose contact -- than in the 20-400 Hz band the heart sounds occupy.
  #
  # This is the ONLY noise proxy of the three that survives the T26.5 sanity
  # check. Measured against the 404 PhysioNet recordings the Challenge
  # organisers marked poor quality (2026-08-26, all 3,541 D1 records):
  #
  #   snr_proxy_db < 5      sens 0.062  spec 0.997  balanced acc 0.530
  #   spectral_flatness>0.5 flags nothing (corpus max is 0.146)
  #   drift_ratio_db > 5    sens 0.634  spec 0.918  balanced acc 0.776
  #   the three OR-ed        sens 0.663  spec 0.915  balanced acc 0.789
  #
  # +5.0 dB was chosen from the sweep in outputs/02_preprocessing/
  # sqi_calibration.csv, not by eye. The two proxies above are KEPT: they fire
  # on out-of-band and white-noise-like records that this one misses, mostly in
  # CirCor. See the 2026-08-26 Phases 26-27 entry in Docs/note.md.
  drift_ratio_db_flag: 5.0
  short_duration_sec: 2.0      # is_short threshold
  # Thresholds are calibrated against PhysioNet REFERENCE-SQI as an independent
  # human-annotated reference (T26.5) rather than chosen by eye.
  calibrate_against_sqi: true

# --- framing (shared by quality analysis and the frequency/MFCC families) ----
framing:
  frame_length: 512            # 256 ms at 2000 Hz
  hop_length: 256              # 128 ms, 50% overlap
  window: "hann"
  center: true

# --- preprocessing cache (Phase 27) -----------------------------------------
cache:
  enabled: true
  format: "npy"
  hash_config: true            # cache key = record_uid + hash of this file

# --- raw-file integrity and audit thresholds (Phases 16-18) -----------------
# NOT part of the preprocessing contract. These thresholds describe the RAW
# files on disk, before any resampling or filtering, and are used by the
# dataset audit only.
#
# T27.3 note: when the preprocessed-signal cache key is built, hash the
# resample / filter / normalization / framing sections only. Hashing this whole
# file would make a change to an audit threshold invalidate every cached
# preprocessed signal, which is unrelated work.
integrity:
  # T16.3 -- an all-silent or constant-value recording. Applied to raw samples
  # scaled to [-1, 1].
  #
  # `silence_peak` is 1e-3 because that IS -60 dBFS, the same silence line
  # `quality.silence_threshold_db` above already draws for the preprocessed
  # signal. One definition of silence for the whole project, not two. An earlier
  # draft used 1e-4 (-80 dBFS), chosen by eye, and it missed the one genuinely
  # dead recording in the corpus: set_a's Aunlabelledtest__201106120928 peaks at
  # -71 dBFS over its full 9 seconds.
  silence_peak: 1.0e-03
  constant_variance: 1.0e-12

  # T16.4 -- full-scale samples. Shares its definition with quality.clipping_*
  # above, which applies the same test to the preprocessed signal in Phase 26.
  clipping_threshold: 0.99
  clipping_ratio_flag: 0.01

  # T16.2 -- a file shorter than this holds too few samples to be a recording
  # at any of the three native rates; treated as truncated rather than short.
  min_samples: 2

  # T17.2 -- the canonical form an audio-content hash is computed on: mono,
  # resampled to this rate, quantized to this many decimal places. Quantizing
  # matters because two resamplers, or two library versions, will not agree in
  # the last float bits on an otherwise identical signal.
  content_hash_fs: 2000
  content_hash_decimals: 5

  # T17.4 -- near-duplicate detection. Envelopes are resampled to a fixed
  # length so recordings of different durations remain comparable, then
  # correlated within each dataset.
  envelope_points: 256
  near_duplicate_correlation: 0.98

  # T18.3 -- robustness duration bands, in seconds.
  duration_bands:
    short_below: 5.0
    long_above: 20.0
