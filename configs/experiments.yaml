# PV-MEPCG / PulseVision — experiment definitions EXP-A1..F2 (T03.5)
#
# Consumed by src/evaluation/experiment.py (T63.1) and run through
# scripts/03_run_experiment.py --exp EXP-A1 (T63.5).
#
# RULE 4 — THE FIVE LABEL SPACES ARE SEPARATE AND ARE NEVER MERGED:
#   binary | pascal_a (4-class) | pascal_b (3-class) | circor_murmur | circor_outcome
# Do not merge PASCAL A and B. Do not fold CirCor murmur into the binary task.
#
# Fold maps are LOADED from DA-07 (outputs/01_dataset_audit/subject_split_map.csv),
# never re-derived at runtime (T43.1). That is what makes two runs comparable
# fold-for-fold.

defaults:
  seed: 42
  # CHANGED 2026-08-28 by the user, from "balanced_accuracy_plus_sensitivity".
  # That objective expands to 1.5*sensitivity + 0.5*specificity, weighting
  # sensitivity three to one. Measured over the first SO-01/SO-02 runs it chose a
  # DIFFERENT winning point than balanced accuracy would in 7 of 8 searches, and
  # the point it chose was 3-9 points higher on sensitivity but 1.0-1.9 points
  # LOWER on balanced accuracy. Phase 50 had already rejected the same objective
  # for the M6/M7 decision threshold on the same evidence; the search now agrees
  # with the threshold instead of pulling against it. See the 2026-08-28 entry in
  # Docs/note.md. `youden` is the same ranking under another name.
  scoring:
    binary: "balanced_accuracy"
    multiclass: "macro_f1"
  # Rule 6 — never accuracy alone. These are reported for EVERY binary run.
  report_metrics_binary:
    ["accuracy", "sensitivity", "specificity", "precision", "f1",
     "balanced_accuracy", "roc_auc", "pr_auc", "mcc", "brier", "ece"]
  report_metrics_multiclass:
    ["accuracy", "macro_f1", "weighted_f1", "balanced_accuracy",
     "per_class_precision", "per_class_recall", "ovr_auc", "mcc"]
  # Rule 6 — final model selection prioritises sensitivity and balanced
  # accuracy, NOT raw accuracy (T65.4).
  selection_rule: ["sensitivity", "balanced_accuracy"]
  output_contract:
    ["per_fold_metrics.csv", "aggregate_metrics.csv", "predictions.parquet",
     "confusion_matrices.json", "config_snapshot.yaml", "run_manifest.json"]

# --- cross-validation schemes ------------------------------------------------
cv_schemes:

  # The protocol for the whole primary binary track. Five repeats x five folds
  # = 25 paired observations, because Wilcoxon/Friedman on n=5 folds cannot
  # reach significance in some configurations at all — the test is
  # mathematically incapable of the result the statistical plan asks for.
  # See Docs/note.md, 2026-08-23 statistics entry.
  repeated_5x5_grouped:
    kind: "RepeatedStratifiedGroupKFold"
    n_splits: 5
    n_repeats: 5
    total_folds: 25
    group_key: "subject_id"
    shuffle: true
    random_state: 42

  # PASCAL A is 124 records with 19 in one class. Five folds would put ~4
  # samples of extrahls in a test fold. 5x2 repeats keep test folds usable.
  repeated_5x2_stratified:
    kind: "RepeatedStratifiedGroupKFold"
    n_splits: 2
    n_repeats: 5
    total_folds: 10
    # PASCAL A has NO recoverable subject IDs, so this is record-level
    # stratification and its results are record-level only. That is a real
    # dataset limitation, not a method limitation, and it is stated as such in
    # the write-up (T21.4).
    #
    # `split_group` is still supplied, and is NOT a subject id: it is
    # record-level for 174 of 176 files. The exception is the single recording
    # Phase 17 found filed under two class labels (extrahls__201104021355 and
    # murmur__201104021355, envelope correlation 0.999978). Those two rows share
    # one group so grouped CV cannot put the same audio in train and test.
    # Dropping the group key would reintroduce that leak.
    group_key: "split_group"
    shuffle: true
    random_state: 42

  grouped_5fold:
    kind: "StratifiedGroupKFold"
    n_splits: 5
    total_folds: 5
    group_key: "subject_id"
    shuffle: true
    random_state: 42

  patient_grouped_5fold:
    kind: "StratifiedGroupKFold"
    n_splits: 5
    total_folds: 5
    group_key: "patient_id"   # CirCor patient IDs are native — no derivation
    shuffle: true
    random_state: 42

  holdout_external:
    kind: "TrainOnAFullTestOnB"
    n_splits: 1
    total_folds: 1

experiments:

  # ==========================================================================
  # TRACK A — PhysioNet binary (the primary track)
  # ==========================================================================

  EXP-A1:
    title: "PhysioNet 2016 binary baseline"
    phase: 64
    dataset: "d1_physionet"
    task: "binary"
    label_space: {normal: 0, abnormal: 1}
    models: ["M1", "M3", "M4", "M5", "M6", "M8"]
    tuned: false                    # default hyperparameters throughout
    cv: "repeated_5x5_grouped"
    # NO external test set for D1. The 301-record `validation/` folder is 301
    # BYTE-IDENTICAL copies of training records (Phase 09), whose 205 subjects
    # account for 1,108 of the 3,240 training records - so a subject-clean
    # holdout would cost 34% of this track for a test set containing no new
    # material. Confirmed with the user 2026-08-26; recorded in
    # outputs/missing_outputs_report.txt. EXP-D1 carries external validation.
    external_test: null
    output_section: "06_binary_results"
    emits: ["T08", "T10"]
    notes: >
      Every model runs on the IDENTICAL 25 folds so EXP-A2 pairs with it
      fold-for-fold. Per-fold values are persisted for the paired tests in
      Phase 81 - aggregating them away would destroy the statistics chapter.

  EXP-A2:
    title: "PhysioNet 2016 binary optimized"
    phase: 65
    dataset: "d1_physionet"
    task: "binary"
    label_space: {normal: 0, abnormal: 1}
    models: ["M1", "M3", "M4", "M5", "M6", "M7", "M8"]
    tuned: true
    tuning_source: ["SO-01", "SO-02"]
    ensemble_weights_source: "SO-05"
    feature_subset_source: "SO-04"
    cv: "repeated_5x5_grouped"      # outer loop; search runs on inner folds
    nested: true
    external_test: null             # see EXP-A1 - the validation folder is a
                                    # duplicate of training, not a held-out set
    output_section: "06_binary_results"
    emits: ["T09"]
    final_model_path: "models_saved/binary/final/"
    notes: >
      Nested CV. The outer fold is never seen by any search. Selection follows
      the sensitivity-and-balanced-accuracy rule, not accuracy.

  # ==========================================================================
  # TRACK B — PASCAL multiclass. A and B are SEPARATE TASKS. Never merged.
  # ==========================================================================

  EXP-B1:
    title: "PASCAL set_a four-class"
    phase: 66
    dataset: "d2_pascal_a"
    task: "pascal_a"
    label_space: {normal: 0, murmur: 1, extrahls: 2, artifact: 3}
    n_records: 124
    class_counts: {normal: 31, murmur: 34, extrahls: 19, artifact: 40}
    models: ["M1", "M3", "M4", "M5", "M6", "M7"]
    tuned: true
    cv: "repeated_5x2_stratified"
    class_weight: "balanced"
    confidence_intervals: true      # mandatory at n=124
    output_section: "07_multiclass_results"
    emits: ["T11"]
    notes: >
      `artifact` is a RECORDING-QUALITY label, not a cardiac class. This is not
      a four-class cardiac classifier and must never be described as one
      (T66.6). Subject IDs are unavailable, so results are record-level only.

  EXP-B2:
    title: "PASCAL set_b three-class"
    phase: 67
    dataset: "d3_pascal_b"
    task: "pascal_b"
    label_space: {normal: 0, murmur: 1, extrastole: 2}
    n_records: 461
    class_counts: {normal: 320, murmur: 95, extrastole: 46}
    n_subject_groups: 165           # filename-derived: 165 subjects over 167
                                    # recording sessions (2 subjects were
                                    # recorded twice). Phase 13; Docs/note.md.
    models: ["M1", "M3", "M4", "M5", "M6", "M7"]
    tuned: true
    cv: "grouped_5fold"
    class_weight: "balanced"
    output_section: "07_multiclass_results"
    emits: ["T12"]
    notes: >
      Severe imbalance (320/95/46). Report per-class recall, not accuracy.
      The report must state explicitly that sets A and B were never merged.

  # ==========================================================================
  # TRACK C — CirCor. Murmur and outcome are SEPARATE TASKS.
  # ==========================================================================

  EXP-C1:
    title: "CirCor murmur classification"
    phase: 68
    dataset: "d4_circor"
    task: "circor_murmur"
    level: "recording"
    n_patients: 942
    n_recordings: 3163
    # Run BOTH ways and report both. Do not silently pick one.
    variants:
      three_class:
        headline: true              # matches the 2022 Challenge
        label_space: {Absent: 0, Present: 1, Unknown: 2}
        class_counts: {Absent: 695, Present: 179, Unknown: 68}
        n_patients: 942
      two_class:
        headline: false
        label_space: {Absent: 0, Present: 1}
        n_patients: 874             # the 68 Unknown patients excluded
    models: ["M3", "M4", "M5", "M6", "M7"]   # the best from EXP-A2
    tuned: true
    cv: "patient_grouped_5fold"
    aggregation_rules: ["max", "mean", "any_present"]
    output_section: "08_circor_external_validation"
    emits: ["T13", "T15"]

  EXP-C2:
    title: "CirCor clinical outcome"
    phase: 69
    dataset: "d4_circor"
    task: "circor_outcome"
    level: "recording"
    label_space: {Normal: 0, Abnormal: 1}
    class_counts: {Normal: 486, Abnormal: 456}
    # THE OUTCOME LABEL IS NOT IN training_data.csv. It exists only as
    # "#Outcome: Normal|Abnormal" inside the per-patient .txt files. A loader
    # built around the CSV produces a murmur-only pipeline and this experiment
    # dies. See Docs/note.md, 2026-08-22 audit, finding 1.
    label_source: "patient_txt_files"
    label_field: "#Outcome"
    models: ["M3", "M4", "M5", "M6", "M7"]
    tuned: true
    cv: "patient_grouped_5fold"
    aggregation_rules: ["max", "mean", "any_present"]
    output_section: "08_circor_external_validation"
    emits: ["T14"]
    notes: >
      Near-balanced (486/456), unlike every other task here. The patient-level
      label is propagated to that patient's recordings; the noise this
      introduces is documented rather than ignored.

  EXP-C3:
    title: "CirCor auscultation-location analysis"
    phase: 70
    dataset: "d4_circor"
    task: "circor_murmur_and_outcome"
    analysis_only: true             # stratifies existing predictions
    depends_on: ["EXP-C1", "EXP-C2"]
    locations:
      AV: 800
      PV: 766
      TV: 732
      MV: 861
      Phc: 4                        # excluded/flagged - statistically uninformative
    exclude_locations: ["Phc"]
    output_section: "08_circor_external_validation"
    emits: ["T22", "G32"]

  # ==========================================================================
  # TRACK D — cross-dataset transfer
  # ==========================================================================

  EXP-D1:
    title: "Cross-dataset transfer: PhysioNet binary -> CirCor outcome"
    phase: 71
    train_dataset: "d1_physionet"
    train_task: "binary"
    test_dataset: "d4_circor"
    test_task: "circor_outcome"
    cv: "holdout_external"
    tuned: true
    tuning_source: "EXP-A2"
    retuning_allowed: false         # NO retuning of any kind on CirCor
    depends_on: ["EXP-A2"]
    output_section: "08_circor_external_validation"
    emits: ["T16", "G29"]
    # Recorded BEFORE the metric exists, so the framing cannot be retrofitted
    # to whatever number comes out (T71.1, T71.7).
    population_note: >
      This is ADULT-TO-PAEDIATRIC TRANSFER, not a like-for-like test. PhysioNet
      has a median age of 25 with 0.3% under 18 and is dominated by adult
      degenerative disease (CAD 287, MVP 134). CirCor is ~98% paediatric (Child
      598, Infant 191, Adolescent 66, Neonate 6). A large performance drop is
      the EXPECTED consequence of that population mismatch and is NOT evidence
      that PV-MEPCG fails to generalize. Describe it as "cross-dataset transfer
      from an adult cohort to a predominantly paediatric cohort" - never as
      "cross-dataset generalization" unqualified. A write-up claiming otherwise
      is wrong.

  # ==========================================================================
  # TRACK E — robustness
  # ==========================================================================

  EXP-E1:
    title: "Noise robustness"
    phase: 72
    datasets: ["d1_physionet", "d2_pascal_a", "d3_pascal_b", "d4_circor"]
    analysis_only: true
    depends_on: ["EXP-A2", "EXP-B1", "EXP-B2", "EXP-C1", "EXP-C2"]
    grouping_source: "PP-08"        # signal_quality_flags.csv
    groups: ["clean", "noisy", "low_confidence"]
    # PhysioNet ships human-annotated REFERENCE-SQI flags. They are used as an
    # INDEPENDENT reference to calibrate our computed proxies against, which is
    # what makes this track defensible rather than self-referential.
    cross_check_source: "REFERENCE-SQI"
    synthetic_noise:
      enabled: true
      kind: "awgn"
      snr_db: [20, 15, 10, 5, 0]
    output_section: "10_robustness"
    emits: ["T20", "G30"]

  EXP-E2:
    title: "Duration robustness"
    phase: 73
    datasets: ["d1_physionet", "d2_pascal_a", "d3_pascal_b", "d4_circor"]
    analysis_only: true
    depends_on: ["EXP-A2", "EXP-B1", "EXP-B2", "EXP-C1", "EXP-C2"]
    bands: ["short", "medium", "long"]
    # The extremes are real and awkward: PASCAL B reaches 0.76 s and PhysioNet
    # reaches 122 s. The shortest records get their own analysis (T73.3).
    shortest_record_sec: 0.76
    longest_record_sec: 122.0
    truncation_study_sec: [3, 5, 10]
    output_section: "10_robustness"
    emits: ["T21", "G31"]

  # ==========================================================================
  # TRACK F — ablation. Identical folds and seed across every configuration.
  # ==========================================================================

  EXP-F1:
    title: "Feature-family ablation A1-A8"
    phase: 74
    dataset: "d1_physionet"
    task: "binary"
    cv: "repeated_5x5_grouped"
    identical_folds_as: "EXP-A1"
    configurations:
      A1: {families: ["time"], n_features: 24}
      A2: {families: ["frequency"], n_features: 22}
      A3: {families: ["mfcc"], n_features: 39}
      A4: {families: ["dwt"], n_features: 24}
      A5: {families: ["time", "frequency"], n_features: 46}
      A6: {families: ["mfcc", "dwt"], n_features: 63}
      A7: {families: ["time", "frequency", "mfcc", "chroma", "dwt", "envelope"], n_features: 138}
      A8: {families: "selected_subset", n_features: "SO-04"}
    output_section: "09_ablation"
    emits: ["T17", "T18"]

  EXP-F2:
    title: "Optimization ablation A9-A10"
    phase: 75
    dataset: "d1_physionet"
    task: "binary"
    cv: "repeated_5x5_grouped"
    identical_folds_as: "EXP-A1"
    configurations:
      A9: {comparison: "best_individual_model_vs_ensemble"}
      A10: {comparison: "equal_weight_vs_optimized_weight_ensemble"}
      three_way: {stages: ["default_params", "tuned_params", "tuned_plus_optimized_ensemble"]}
    incremental_deltas: true        # isolate each optimization stage
    output_section: "09_ablation"
    emits: ["T19", "G23", "G24"]

  # ==========================================================================
  # SUPPLEMENTARY — PhysioNet diagnosis multiclass (confirmed in scope)
  # ==========================================================================

  EXP-G1:
    title: "PhysioNet diagnosis multiclass (supplementary, Objective 6)"
    phase: 76
    dataset: "d1_physionet"
    task: "diagnosis_multiclass"
    supplementary: true
    n_records: 3240
    class_counts:
      CAD: 287
      MVP: 134
      Benign: 118
      Pathologic: 62
      MPC: 23
      AD: 17
      MR: 12
      AS: 12
    merge_rare_classes: true        # policy documented explicitly at T76.2
    models: ["M1", "M3", "M4", "M5", "M6", "M7"]
    cv: "grouped_5fold"
    class_weight: "balanced"
    confidence_intervals: true
    output_section: "07_multiclass_results"
    notes: >
      Carries Objective 6 properly. PASCAL A cannot: it is 124 records with 19
      in one class. Presented as supplementary evidence on a far larger sample,
      with the small-sample limitation stated and CIs on every per-class metric.
