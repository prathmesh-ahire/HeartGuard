# ---------------------------------------------------------------------------
# PV-MEPCG / PulseVision — consolidated tool configuration
#
# ruff, mypy and pytest were each in their own root-level file (ruff.toml,
# mypy.ini, pytest.ini). All three read pyproject.toml, so they are merged here
# to keep the repository root legible. The reasoning behind every setting is
# preserved verbatim from the original files -- none of it is decoration.
#
# Dependencies are NOT declared here. They live in requirements/, pinned, so
# that a reproduction installs exact versions rather than a resolver's choice.
# ---------------------------------------------------------------------------

# ===========================================================================
# ruff — linting and formatting (Phase 08, task T08.3)
#
# The rule set is declared EXPLICITLY rather than inherited from ruff's
# defaults. Those defaults widen between releases, so a pinned-but-undeclared
# configuration means a future ruff bump turns CI red for reasons unrelated to
# any change in this repository. Pinning the version and declaring the rules
# are both required; neither alone is enough.
# ===========================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — keep the code idiomatic for 3.11
    "B",    # bugbear — real bug patterns, notably B008 and mutable defaults
    "BLE",  # blind except — every `except Exception` must be justified with a noqa
    "C4",   # comprehensions
    "SIM",  # simplify
    "TRY",  # exception antipatterns
    "S",    # bandit security checks
    "RUF",  # ruff-specific
]

ignore = [
    # Subprocess use is deliberate and the arguments are literals built in this
    # repository, never user input: git metadata for the run manifest, and the
    # node/npm probes in verify_env.py.
    "S603",   # subprocess call without shell=True check
    "S607",   # partial executable path

    # `raise ... from err` inside a narrow except is good practice, but TRY003
    # objects to long messages in exceptions and TRY300/TRY301 restructure
    # control flow in ways that read worse here. Error messages in this project
    # are deliberately long because they are read by whoever is debugging a
    # 7,536-record run at 2am.
    "TRY003",
    "TRY300",

    # `__all__` ordering is grouped by meaning (types, then constants, then
    # functions) rather than alphabetically. Alphabetical order would scatter
    # related names and makes the module's shape harder to read.
    "RUF022",
    "RUF023",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately assert on private behaviour, use bare asserts, and build
# throwaway values. Security and complexity rules aimed at production paths do
# not apply to them.
"tests/**" = ["S101", "S311", "SLF001"]
"conftest.py" = ["S101"]
# Scripts are entry points: printing is their interface, and they touch the
# environment on purpose.
"scripts/**" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() idiom requires callables in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ===========================================================================
# mypy — static type checking (Phase 08, task T08.3)
#
# Deliberately NOT --strict. The scientific stack this project depends on is
# largely untyped or partially typed: librosa, PyWavelets, deap, pyswarms and
# skopt ship no usable stubs, and numpy/pandas typing is broad enough that
# strict mode would produce hundreds of unavoidable errors. A type checker
# whose output is 95% noise gets ignored, and an ignored check is a check that
# isn't running.
#
# The settings below catch the errors that actually bite: calling a function
# that doesn't exist, returning the wrong type, and unreachable code.
# They can be tightened per-module as the pipeline is built.
# ===========================================================================
[tool.mypy]
python_version = "3.11"
files = ["src"]
namespace_packages = true
explicit_package_bases = true

# --- what is checked -------------------------------------------------------
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

# --- what is deliberately not required yet ---------------------------------
# Requiring annotations everywhere is a Part II+ decision, once the pipeline
# modules exist and their signatures have settled.
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# --- output ----------------------------------------------------------------
pretty = true
show_error_codes = true
show_column_numbers = true

# --- third-party packages with no stubs ------------------------------------
# pandas 3.0 ships no py.typed marker mypy can use, and pandas-stubs lags the
# release. Revisit once stubs for 3.x are available.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# The rest are listed individually rather than with a blanket
# ignore_missing_imports, so a genuine typo in an import of OUR code is still
# an error.
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "librosa.*",
    "soundfile.*",
    "soxr.*",
    "pywt.*",
    "numba.*",
    "sklearn.*",
    "scipy.*",
    "skopt.*",
    "deap.*",
    "pyswarms.*",
    "shap.*",
    "xgboost.*",
    "lightgbm.*",
    "statsmodels.*",
    "matplotlib.*",
    "seaborn.*",
    "joblib.*",
    "docx.*",
    "kaleido.*",
]
ignore_missing_imports = true

# ===========================================================================
# pytest — test configuration (Phase 06, task T06.1)
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --strict-markers: an unregistered marker is an ERROR, not a silent no-op.
#   Without it, a typo like @pytest.mark.needs_dataa attaches a marker nothing
#   ever selects on, so the test runs in CI where the dataset does not exist
#   and fails there instead of skipping. Strict mode turns that typo into an
#   immediate collection error.
# --strict-config: an unknown ini key is an error rather than being ignored.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--durations=10",
]

markers = [
    "slow: takes more than a few seconds. Skipped by default; pass --runslow to include.",
    "needs_data: reads the real dataset/ tree. Auto-skipped when dataset/ is absent -- the 1.3 GB corpus is gitignored and never reaches CI, so these are excluded there by design, not by accident. CI additionally deselects them with -m \"not needs_data\".",
]

# Keep the log file this suite produces out of outputs/logs/ noise concerns:
# tests that configure logging use the tmp_output_dir fixture instead.
log_cli = false

filterwarnings = ["default"]
