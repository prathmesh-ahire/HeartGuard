# PV-MEPCG / PulseVision — ruff configuration (Phase 08, task T08.3)
#
# The rule set is declared EXPLICITLY rather than inherited from ruff's
# defaults. Those defaults widen between releases, so a pinned-but-undeclared
# configuration means a future ruff bump turns CI red for reasons unrelated to
# any change in this repository. Pinning the version and declaring the rules are
# both required; neither alone is enough.

target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade — keep the code idiomatic for 3.11
    "B",    # bugbear — real bug patterns, notably B008 and mutable defaults
    "BLE",  # blind except — every `except Exception` must be justified with a noqa
    "C4",   # comprehensions
    "SIM",  # simplify
    "TRY",  # exception antipatterns
    "S",    # bandit security checks
    "RUF",  # ruff-specific
]

ignore = [
    # Subprocess use is deliberate and the arguments are literals built in this
    # repository, never user input: git metadata for the run manifest, and the
    # node/npm probes in verify_env.py.
    "S603",   # subprocess call without shell=True check
    "S607",   # partial executable path

    # `raise ... from err` inside a narrow except is good practice, but TRY003
    # objects to long messages in exceptions and TRY300/TRY301 restructure
    # control flow in ways that read worse here. Error messages in this project
    # are deliberately long because they are read by whoever is debugging a
    # 7,536-record run at 2am.
    "TRY003",
    "TRY300",

    # `__all__` ordering is grouped by meaning (types, then constants, then
    # functions) rather than alphabetically. Alphabetical order would scatter
    # related names and makes the module's shape harder to read.
    "RUF022",
    "RUF023",
]

[lint.per-file-ignores]
# Tests deliberately assert on private behaviour, use bare asserts, and build
# throwaway values. Security and complexity rules aimed at production paths do
# not apply to them.
"tests/**" = ["S101", "S311", "SLF001"]
"conftest.py" = ["S101"]
# Scripts are entry points: printing is their interface, and they touch the
# environment on purpose.
"scripts/**" = ["S101", "T201"]

[lint.isort]
known-first-party = ["src", "tests"]

[lint.flake8-bugbear]
# FastAPI's Depends()/Query() idiom requires callables in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
