; PV-MEPCG / PulseVision — mypy configuration (Phase 08, task T08.3)
;
; Deliberately NOT --strict. The scientific stack this project depends on is
; largely untyped or partially typed: librosa, PyWavelets, deap, pyswarms and
; skopt ship no usable stubs, and numpy/pandas typing is broad enough that
; strict mode would produce hundreds of unavoidable errors. A type checker whose
; output is 95% noise gets ignored, and an ignored check is a check that isn't
; running.
;
; The settings below catch the errors that actually bite: calling a function
; that doesn't exist, returning the wrong type, and unreachable code.
; They can be tightened per-module as the pipeline is built.

[mypy]
python_version = 3.11
files = src
namespace_packages = True
explicit_package_bases = True

; --- what is checked ---------------------------------------------------------
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

; --- what is deliberately not required yet -----------------------------------
; Requiring annotations everywhere is a Part II+ decision, once the pipeline
; modules exist and their signatures have settled.
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

; --- output ------------------------------------------------------------------
pretty = True
show_error_codes = True
show_column_numbers = True

; --- third-party packages with no stubs --------------------------------------
; Listed individually rather than with a blanket ignore_missing_imports, so a
; genuine typo in an import of OUR code is still an error.
[mypy-pandas.*]
; pandas 3.0 ships no py.typed marker mypy can use, and pandas-stubs
; lags the release. Revisit once stubs for 3.x are available.
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-librosa.*]
ignore_missing_imports = True

