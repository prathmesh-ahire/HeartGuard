# PV-MEPCG / PulseVision — continuous integration (Phase 08)
#
# ============================================================================
# WHAT THIS CI CAN AND CANNOT PROVE  (T08.5 — read this before trusting a green
# tick, and before adding a check that assumes otherwise)
# ============================================================================
#
# The 1.3 GB `dataset/` tree is gitignored and NEVER reaches GitHub. Every
# data-dependent test is therefore excluded here BY DESIGN, not by accident:
# the `needs_data` marker auto-skips when `dataset/` is absent, and the pytest
# job additionally deselects those tests with `-m "not needs_data"` so the
# exclusion is explicit in the log rather than inferred from a skip count.
#
# CI PROVES:
#   * the package imports on a clean machine, from the pinned requirements
#     alone — catching an import that only works because of something left
#     installed locally
#   * every pinned version actually resolves and installs
#   * the logic tests pass (label vocabularies, config validation, atomic IO,
#     the synthetic-signal harness)
#   * ruff and mypy are clean over src/
#   * from Part X: the frontend builds and contains no hand-typed metric
#
# CI PROVES NOTHING ABOUT:
#   * behaviour on real audio — resampling, filtering, feature extraction,
#     every count and every metric
#   * fold safety, subject leakage, or any result
#   * anything requiring the four dataset families
#
# That evidence comes from the phase `[TEST]` gates and the five MEGA TEST
# phases (29, 52, 76, 104, 120), which run locally against the real files. A
# green tick here is a statement about the code, never about the science.
#
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run is wasted compute; cancel it when a newer commit arrives.
# Never cancel on main — those runs are the record of what was pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The exact locked version, not "3.11". setup-python resolves "3.11" to the
  # latest patch, which would not be the version this project is pinned to --
  # and tests/test_env.py asserts the exact version on purpose.
  PYTHON_VERSION: "3.11.9"
  # Determinism: set BEFORE the interpreter starts, which is the only point at
  # which it has any effect (see src/utils/seed.py).
  PYTHONHASHSEED: "42"

jobs:
  # --------------------------------------------------------------------------
  # T08.2 — tests
  # --------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/extra.txt
            requirements/api.txt
            requirements/report.txt
            requirements/dev.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            -r requirements/base.txt \
            -r requirements/extra.txt \
            -r requirements/api.txt \
            -r requirements/report.txt \
            -r requirements/dev.txt

      - name: Confirm the dataset is absent (it must never reach CI)
        run: |
          if [ -d dataset ] && [ -n "$(ls -A dataset 2>/dev/null)" ]; then
            echo "::error::dataset/ is present in CI. The 1.3 GB corpus must"
            echo "::error::never be committed. Check .gitignore before anything else."
            exit 1
          fi
          echo "dataset/ absent, as expected — needs_data tests will be excluded"

      - name: Run tests
        # -m "not needs_data" makes the exclusion explicit in the log. The
        # marker would auto-skip them anyway with dataset/ absent; saying it
        # twice means a future change to either mechanism cannot silently
        # start running tests that have no data to run against.
        run: >
          pytest -m "not needs_data"
          --cov=src --cov-report=term-missing
          --junitxml=junit.xml

      - name: Surface failures as annotations
        # Raw job logs need an authenticated token to fetch, but annotations are
        # readable from the public API. Without this, a red build reports only
        # "Process completed with exit code 1" to anyone without log access --
        # which is exactly how the first failure of this workflow was debugged
        # blind. Emitting ::error:: lines makes the failing test names visible.
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("junit.xml")
          if not path.is_file():
              print("::error::pytest produced no junit.xml — it failed before collection")
              raise SystemExit(0)

          root = ET.parse(path).getroot()
          for case in root.iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is None:
                      continue
                  name = f"{case.get('classname', '')}::{case.get('name', '')}"
                  detail = " ".join((node.get("message") or "").split())[:400]
                  print(f"::error title={kind}::{name} — {detail}")
          PY

      - name: Summarise what was NOT proven
        if: always()
        run: |
          {
            echo "### What this run did not prove"
            echo ""
            echo "\`dataset/\` is gitignored and absent here, so every"
            echo "data-dependent test was excluded. Nothing in this run says"
            echo "anything about behaviour on real audio, fold safety, or any"
            echo "metric. That evidence comes from the local phase gates."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # T08.3 — lint and type check
  # --------------------------------------------------------------------------
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/api.txt
            requirements/dev.txt

      - name: Install requirements
        # mypy needs the runtime packages present to resolve real signatures;
        # installing only requirements/dev.txt would type-check against stubs
        # that do not match what the project actually runs.
        #
        # api.txt joined this list in Phase 108: mypy checks all of src/, and
        # src/api/ imports fastapi and pydantic. Both ship py.typed, so the
        # alternative -- adding them to ignore_missing_imports -- would have
        # silently discarded type checking on the one module that serves the
        # network. Installing them keeps the check real.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/base.txt -r requirements/api.txt -r requirements/dev.txt

      - name: ruff
        run: ruff check src/ tests/ scripts/ conftest.py

      - name: ruff format check
        run: ruff format --check --diff src/ tests/ scripts/ conftest.py
        continue-on-error: true   # advisory: formatting is not yet enforced

      - name: mypy
        run: mypy

  # --------------------------------------------------------------------------
  # T08.4 — frontend (activates from Part X; skips cleanly until then)
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend build and metric guard rail
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect whether the frontend exists yet
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json found — building"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json absent — Part X has not started; skipping"
          fi

      - name: Set up Node LTS
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Python is set up BEFORE the build, not after it. T110.5 wires
      # `npm run build` to run the frontend data exporter first, so the site can
      # never build against stale data -- and the exporter is Python. With the
      # interpreter installed afterwards the hook could only fail here, and the
      # tempting fix (let CI fall back to the committed `generated/`) would
      # reopen exactly the hole the guard rail below exists to close: a change
      # to `outputs/` with a forgotten re-export would pass CI showing stale
      # numbers. Everything the exporter reads is committed -- 105 CSVs and 29
      # JSONs under `outputs/` -- so it runs here identically to a local build.
      # Only `*.parquet` and working state are gitignored, and the exporter must
      # never read those.
      - name: Set up Python for the exporter and the guard rail
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install Python requirements for the exporter
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Install and build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: No hard-coded metrics
        # The rule that matters more than any other: the client never computes
        # and never declares a metric. This grep-based check fails the build on
        # any numeric metric literal in frontend/app/ or frontend/components/.
        # It exists because a parallel implementation of this same brief shipped
        # a 95.82% PhysioNet result its pipeline never produced.
        #
        # `todo.md` and CLAUDE.md name this `scripts/07_check_no_hardcoded_metrics.py`.
        # The `07` slot was taken by `07_run_population_search.py` long before
        # Part X started, so it lands as `16_` -- the same numbering drift already
        # recorded for scripts 11-15 in Docs/note.md. The step fails loudly if the
        # script is absent rather than passing a frontend nobody checked.
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ ! -f scripts/16_check_no_hardcoded_metrics.py ]; then
            echo "::error::scripts/16_check_no_hardcoded_metrics.py is missing — the" \
                 "frontend metric guard rail did not run. Part X must not ship without it."
            exit 1
          fi
          python scripts/16_check_no_hardcoded_metrics.py

      - name: Displayed-value audit
        # The other half of the guard rail, and the only place it can run.
        #
        # The grep check above sees a literal typed into a `.tsx` file. It
        # cannot see what a page actually rendered -- a template expression, a
        # value formatted in the wrong place, or a payload the site was built
        # against before the exporter changed. These tests read the exported
        # HTML in `frontend/out/` and check every stated number against the CSV
        # in `outputs/` that produced it, in both directions.
        #
        # They run HERE rather than in the tests job because `frontend/out/` is
        # a build artifact: it exists in this job and nowhere else. In the
        # Python job they skip, by design, and skipping there is why they must
        # not be left out here.
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install -r requirements/dev.txt
          pytest tests/test_pages_1_3.py tests/test_pages_4_6.py -q

      - name: Report skip
        if: steps.detect.outputs.present != 'true'
        run: |
          echo "Frontend job skipped: Part X has not started." >> "$GITHUB_STEP_SUMMARY"
